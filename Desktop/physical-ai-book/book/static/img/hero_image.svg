<svg width="600" height="300" viewBox="0 0 600 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="300" fill="#F0F8FF"/> 
  
  <!-- Robot Body -->
  <rect x="250" y="100" width="100" height="150" rx="10" fill="#4682B4"/> 
  <circle cx="300" cy="80" r="40" fill="#4682B4"/> 
  
  <!-- Robot Eyes -->
  <circle cx="280" cy="70" r="8" fill="#FFD700"/>
  <circle cx="320" cy="70" r="8" fill="#FFD700"/>
  
  <!-- Robot Arms -->
  <rect x="200" y="110" width="40" height="100" rx="8" fill="#708090"/>
  <rect x="360" y="110" width="40" height="100" rx="8" fill="#708090"/>
  
  <!-- AI Brain / Circuit Pattern -->
  <path d="M400 100 Q 450 50, 500 100 T 600 100" stroke="#FF4500" stroke-width="3" fill="none"/>
  <path d="M400 150 Q 450 200, 500 150 T 600 150" stroke="#32CD32" stroke-width="3" fill="none"/>
  <circle cx="450" cy="75" r="15" fill="#1E90FF"/>
  <circle cx="450" cy="175" r="15" fill="#BA55D3"/>
  <path d="M450 75 L 450 175" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M350 120 L 450 120" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M350 180 L 450 180" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Data Visualization elements -->
  <rect x="0" y="200" width="180" height="20" fill="#FF8C00"/>
  <rect x="0" y="230" width="150" height="20" fill="#FF8C00"/>
  <rect x="0" y="260" width="120" height="20" fill="#FF8C00"/>
</svg>
